name: "Soma"
author: "Ewerton Carreira"
description: "Esta ação realiza a soma de dois números."
inputs:
  a:
    description: "First number"
    required: true
  b:
    description: "Second number"
    required: true
runs:
  using: "composite"
  steps:
    - name: Checkout repository content
      uses: actions/checkout@v2

    - name: setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: "run Soma"
      shell: bash
      run: python ${{ github.action_path }}/soma.py --a=${{ inputs.a }} --b=${{ inputs.b }}
