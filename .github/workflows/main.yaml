name: CI

on:
  # schedule:
  #  - cron: '47 12 * * *'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Build"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        uses: carreiras/devsecops-with-github-actions@main
        with:
          a: ${{ secrets.SECRET_A }}
          b: 4
      - name: File
        run: echo "Test" > test.txt
      - name: Download
        uses: actions/upload-artifact@v4
        with:
          path: test.txt
          
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "Deploy"

